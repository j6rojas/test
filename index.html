<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHEM 118 — Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;
    --surface: #141416;
    --surface2: #1c1c20;
    --surface3: #242428;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0efe8;
    --muted: #888880;
    --faint: #444440;
    --accent: #c8b97a;
    --accent-dim: rgba(200,185,122,0.12);
    --accent-glow: rgba(200,185,122,0.06);
    --red: #e05c5c;
    --green: #5ce08a;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── layout ── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 52px 1fr;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── topbar ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
  }

  .topbar-logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .topbar-divider { width: 1px; height: 20px; background: var(--border2); }

  .topbar-class {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  .topbar-search {
    margin-left: auto;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--faint);
    font-size: 13px;
    pointer-events: none;
  }

  #search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px 6px 30px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search-input::placeholder { color: var(--faint); }
  #search-input:focus { border-color: var(--border2); }

  /* ── sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--faint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── upload zone ── */
  .upload-zone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon { font-size: 22px; margin-bottom: 6px; }

  .upload-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .upload-text span { color: var(--accent); }

  .upload-progress {
    display: none;
    margin-top: 10px;
    height: 3px;
    background: var(--surface3);
    border-radius: 2px;
    overflow: hidden;
  }

  .upload-progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
    border-radius: 2px;
  }

  /* ── file list in sidebar ── */
  .file-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .file-list::-webkit-scrollbar { width: 4px; }
  .file-list::-webkit-scrollbar-track { background: transparent; }
  .file-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
    group: true;
  }
  .file-item:hover { background: var(--surface2); }
  .file-item.active { background: var(--accent-dim); }
  .file-item.active .file-name { color: var(--accent); }
  .file-item.hidden { display: none; }

  .file-icon {
    font-size: 16px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  .file-meta { flex: 1; min-width: 0; }

  .file-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .file-size {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
    margin-top: 1px;
  }

  .file-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 13px;
    transition: opacity 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .file-item:hover .file-delete { opacity: 1; }
  .file-delete:hover { background: rgba(224,92,92,0.15); }

  .empty-state {
    text-align: center;
    padding: 30px 16px;
    color: var(--faint);
    font-size: 12px;
    line-height: 1.6;
    display: none;
  }
  .empty-state.show { display: block; }

  /* ── main viewer ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .viewer-toolbar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .viewer-toolbar.show { display: flex; }

  .viewer-filename {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .viewer-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 12px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .viewer-btn:hover { border-color: var(--border2); color: var(--text); }

  .pdf-frame {
    flex: 1;
    width: 100%;
    border: none;
    display: none;
    background: #1a1a1a;
  }
  .pdf-frame.show { display: block; }

  /* ── welcome screen ── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--faint);
    text-align: center;
    padding: 40px;
  }
  .welcome.hidden { display: none; }

  .welcome-icon { font-size: 48px; opacity: 0.3; margin-bottom: 8px; }

  .welcome-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
  }

  .welcome-sub {
    font-size: 13px;
    line-height: 1.6;
    max-width: 280px;
  }

  /* ── stats bar ── */
  .stats {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .stat {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
  }

  /* ── toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: rgba(92,224,138,0.3); color: var(--green); }
  .toast.error { border-color: rgba(224,92,92,0.3); color: var(--red); }

  /* ── animations ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-item { animation: fadeIn 0.2s ease both; }
</style>
</head>
<body>

<div class="app">

  <!-- topbar -->
  <header class="topbar">
    <span class="topbar-logo">study//</span>
    <div class="topbar-divider"></div>
    <span class="topbar-class">CHEM 118</span>
    <div class="topbar-search">
      <span class="search-icon">⌕</span>
      <input id="search-input" type="text" placeholder="search slides..." autocomplete="off" />
    </div>
  </header>

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Upload</div>
      <div class="upload-zone" id="upload-zone">
        <input type="file" accept=".pdf" multiple id="file-input" />
        <div class="upload-icon">📄</div>
        <div class="upload-text"><span>Click or drag</span> PDF files here</div>
        <div class="upload-progress" id="upload-progress">
          <div class="upload-progress-bar" id="upload-bar"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-section" style="border-bottom:none;padding-bottom:4px;">
      <div class="sidebar-label">Slides <span id="file-count" style="color:var(--faint)"></span></div>
    </div>

    <div class="file-list" id="file-list">
      <div class="empty-state" id="empty-state">
        No slides yet.<br>Upload your first PDF above.
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-dot"></span> CHEM 118</div>
      <div class="stat" id="total-size">0 MB stored</div>
    </div>
  </aside>

  <!-- main viewer -->
  <main class="main">
    <div class="viewer-toolbar" id="viewer-toolbar">
      <span class="viewer-filename" id="viewer-filename">—</span>
      <a class="viewer-btn" id="open-new-tab" href="#" target="_blank">↗ open in tab</a>
      <button class="viewer-btn" onclick="closeViewer()">✕ close</button>
    </div>

    <div class="welcome" id="welcome">
      <div class="welcome-icon">⚗️</div>
      <div class="welcome-title">CHEM 118 Study Dashboard</div>
      <div class="welcome-sub">Upload your lecture slides on the left, then click any file to read it here.</div>
    </div>

    <iframe class="pdf-frame" id="pdf-frame" title="PDF Viewer"></iframe>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
  let files = [];
  let activeFile = null;

  // ── init ──
  async function init() {
    await loadFiles();
  }

  // ── load files from server ──
  async function loadFiles() {
    try {
      const res = await fetch("/api/files");
      files = await res.json();
      renderFileList();
    } catch (e) {
      showToast("Couldn't load files", "error");
    }
  }

  // ── render file list ──
  function renderFileList() {
    const list = document.getElementById("file-list");
    const empty = document.getElementById("empty-state");
    const countEl = document.getElementById("file-count");
    const sizeEl = document.getElementById("total-size");

    // Remove existing file items (keep empty state)
    list.querySelectorAll(".file-item").forEach(el => el.remove());

    const query = document.getElementById("search-input").value.toLowerCase();
    const filtered = files.filter(f => f.name.toLowerCase().includes(query));

    countEl.textContent = files.length > 0 ? `(${files.length})` : "";

    const totalBytes = files.reduce((sum, f) => sum + f.size, 0);
    sizeEl.textContent = (totalBytes / (1024 * 1024)).toFixed(1) + " MB stored";

    if (files.length === 0) {
      empty.classList.add("show");
    } else {
      empty.classList.remove("show");
    }

    filtered.forEach((file, i) => {
      const item = document.createElement("div");
      item.className = "file-item" + (file.name === activeFile ? " active" : "");
      item.style.animationDelay = (i * 0.04) + "s";
      item.dataset.name = file.name;

      const sizeMB = (file.size / (1024 * 1024)).toFixed(1);

      item.innerHTML = `
        <span class="file-icon">📑</span>
        <div class="file-meta">
          <div class="file-name" title="${file.name}">${file.name.replace(".pdf","")}</div>
          <div class="file-size">${sizeMB} MB</div>
        </div>
        <button class="file-delete" onclick="deleteFile(event, '${file.name}')" title="Delete">✕</button>
      `;

      item.addEventListener("click", (e) => {
        if (e.target.classList.contains("file-delete")) return;
        openFile(file.name);
      });

      list.appendChild(item);
    });

    if (filtered.length === 0 && files.length > 0) {
      const noResult = document.createElement("div");
      noResult.className = "empty-state show";
      noResult.style.display = "block";
      noResult.textContent = "No slides match your search.";
      list.appendChild(noResult);
    }
  }

  // ── open PDF ──
  function openFile(name) {
    activeFile = name;
    const url = "/uploads/" + encodeURIComponent(name);

    document.getElementById("pdf-frame").src = url;
    document.getElementById("pdf-frame").classList.add("show");
    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("viewer-toolbar").classList.add("show");
    document.getElementById("viewer-filename").textContent = name.replace(".pdf", "");
    document.getElementById("open-new-tab").href = url;

    renderFileList();
  }

  // ── close viewer ──
  function closeViewer() {
    activeFile = null;
    document.getElementById("pdf-frame").classList.remove("show");
    document.getElementById("pdf-frame").src = "";
    document.getElementById("welcome").classList.remove("hidden");
    document.getElementById("viewer-toolbar").classList.remove("show");
    renderFileList();
  }

  // ── delete file ──
  async function deleteFile(e, name) {
    e.stopPropagation();
    if (!confirm(`Delete "${name.replace(".pdf","")}"?`)) return;
    try {
      await fetch("/api/delete/" + encodeURIComponent(name), { method: "DELETE" });
      if (activeFile === name) closeViewer();
      showToast("Deleted " + name.replace(".pdf",""), "success");
      await loadFiles();
    } catch {
      showToast("Couldn't delete file", "error");
    }
  }

  // ── upload ──
  async function uploadFiles(fileList) {
    const progress = document.getElementById("upload-progress");
    const bar = document.getElementById("upload-bar");
    progress.style.display = "block";
    bar.style.width = "0%";

    for (let i = 0; i < fileList.length; i++) {
      const file = fileList[i];
      if (!file.name.endsWith(".pdf")) {
        showToast("Only PDF files please!", "error");
        continue;
      }

      const formData = new FormData();
      formData.append("file", file);

      try {
        bar.style.width = ((i / fileList.length) * 80 + 10) + "%";
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (data.success) {
          showToast("Uploaded " + file.name.replace(".pdf",""), "success");
        }
      } catch {
        showToast("Upload failed for " + file.name, "error");
      }
    }

    bar.style.width = "100%";
    setTimeout(() => { progress.style.display = "none"; bar.style.width = "0%"; }, 600);
    await loadFiles();
  }

  // ── file input ──
  document.getElementById("file-input").addEventListener("change", function() {
    if (this.files.length) uploadFiles(this.files);
    this.value = "";
  });

  // ── drag and drop ──
  const zone = document.getElementById("upload-zone");
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag-over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("drag-over");
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });

  // ── search ──
  document.getElementById("search-input").addEventListener("input", renderFileList);

  // ── toast ──
  let toastTimer;
  function showToast(msg, type = "") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (type ? " " + type : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = "toast", 2500);
  }

  init();
</script>
</body>
</html>
